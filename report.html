<!DOCTYPE html>
<html lang="en">
<head>
    <title>Generate Report - CaseLens AI</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="upload.html">Upload</a>
        </nav>
    </header>
    <main>
        <h1>Generate Case Report</h1>
        <p>Create A Structured & Professional Case Report</p>
        <form action="#" method="post">
            <fieldset>
                <legend>Report Sections</legend>
                <div>
                    <input type="checkbox" id="summary" name="sections" value="summary" checked>
                    <label for="summary">Executive Summary</label>
                </div>
                <div>
                    <input type="checkbox" id="timeline" name="sections" value="timeline" checked>
                    <label for="timeline">Timeline</label>
                </div>
                <div>
                    <input type="checkbox" id="insights" name="sections" value="insights">
                    <label for="insights">Key Insights</label>
                </div>
            </fieldset>
        </form>
    </main>
</body>
</html>
